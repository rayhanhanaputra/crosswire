name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"; echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        shell: bash
        run: CGO_ENABLED=0 go build -o crosswire ./cmd/crosswire

      - name: Selftest
        shell: bash
        run: ./crosswire selftest

  registry:
    name: knowledge base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Validate knowledge base and mappings
        run: python -I tools/build_registry.py --check

      - name: Check registry is up to date
        run: |
          python -I tools/build_registry.py
          if ! git diff --quiet -- registry/; then
            echo "registry/ is out of date. Run: make registry"
            git --no-pager diff -- registry/
            exit 1
          fi

  markdownlint:
    name: markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !LICENSE-CODE
            !LICENSE-DOCS
            !node_modules/**
            !dist/**
            !out/**
